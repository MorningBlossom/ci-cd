name: JIRA-VALIDATION

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  workflow_call:

permissions:
  pull-requests: read
  checks: write

jobs:
  check-jira-validation:
    name: jira-check
    runs-on: ubuntu-latest
    steps:
      - name: JIRA Validation
        uses: lanzark/jira-validation@v1.4.0
        with:
          jira-keys: 'SP'