name: CI/CD Pipeline

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        default: '1.27'
        type: string
        required: false

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{inputs.go-version}}
          cache: true

      - name: Run Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run Tests
        run: go test -v -race -cover ./...

  docker-publish:
    name: docker Build,tag & push
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    # FIX: Export the generated tag so trigger-deployment can read it
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/service
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deployment:
    name: Trigger Deployment Dispatch
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send repository_dispatch to Infra Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE_NAME: ${{ github.event.repository.name }}
          TARGET_REPO: "MorningBlossom/release"
          IMAGE_PATH: "ghcr.io/${{ github.repository }}/service"
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image-tag }}
        run: |
          echo "Dispatching 'deploy-service' to $TARGET_REPO for $SERVICE_NAME with tag $IMAGE_TAG..."
          
          gh api "repos/$TARGET_REPO/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -F "event_type=deploy-service" \
            -F "client_payload[service]=$SERVICE_NAME" \
            -F "client_payload[image]=$IMAGE_PATH" \
            -F "client_payload[tag]=$IMAGE_TAG"